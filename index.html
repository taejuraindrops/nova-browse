
<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova Browser</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #10131c;
  color: #f4f6ff;
  font: 16px Arial, sans-serif;
}
header {
  padding: 24px;
  background: #181d2a;
  border-bottom: 1px solid #303749;
}
h1 { margin: 0 0 8px; color: #79aaff; }
p { color: #aab4ca; }
main { max-width: 1000px; margin: auto; padding: 24px; }
form { display: flex; gap: 8px; }
input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border: 1px solid #39435b;
  border-radius: 10px;
  background: #202638;
  color: white;
  font-size: 16px;
}
button {
  padding: 14px 18px;
  border: 0;
  border-radius: 10px;
  background: #679cff;
  color: #10131c;
  font-weight: bold;
  cursor: pointer;
}
.shortcuts {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 22px 0;
}
.shortcuts button { background: #252c40; color: white; }
#notice { font-size: 14px; }
iframe {
  width: 100%;
  height: 60vh;
  min-height: 350px;
  border: 1px solid #39435b;
  border-radius: 12px;
  background: white;
}
</style>
</head>
<body>
<header>
  <h1>🌐 Nova Browser</h1>
  <p>Your web, your way.</p>
</header>

<main>
  <form id="searchForm">
    <input id="address" placeholder="Søk eller skriv en nettadresse..."
           aria-label="Søk eller nettadresse" required>
    <button type="submit">Åpne</button>
  </form>

  <div class="shortcuts">
    <button type="button" data-url="https://example.com">Testside</button>
    <button type="button" data-url="https://www.wikipedia.org">Wikipedia</button>
  </div>

  <p id="notice">Søk åpnes i en ny fane. Nettsider som tillater
  innebygging, kan vises i vinduet nedenfor.</p>

  <iframe id="viewer" title="Nettsidevisning"
          src="https://example.com"
          referrerpolicy="no-referrer"></iframe>
</main>

<script>
const form = document.getElementById('searchForm');
const address = document.getElementById('address');
const viewer = document.getElementById('viewer');
const notice = document.getElementById('notice');

function openAddress(value) {
  let url;

  try {
    const input = value.trim();
    if (!input) return;

    if (/^https?:\/\//i.test(input)) {
      url = new URL(input);
    } else if (/^[a-z0-9-]+\.[a-z]{2,}([/:?#]|$)/i.test(input)) {
      url = new URL('https://' + input);
    } else {
      url = new URL('https://www.google.com/search');
      url.searchParams.set('q', input);
    }

    if (!['http:', 'https:'].includes(url.protocol)) {
      throw new Error('Ugyldig adresse');
    }
  } catch {
    notice.textContent = 'Ugyldig adresse. Prøv igjen.';
    return;
  }

  if (url.hostname === 'www.google.com' &&
      url.pathname === '/search') {
    window.open(url.href, '_blank', 'noopener,noreferrer');
    notice.textContent = 'Søket ble åpnet i en ny fane.';
    return;
  }

  viewer.src = url.href;
  notice.textContent =
    'Prøver å åpne siden. Noen nettsteder blokkerer innebygging.';
}

form.addEventListener('submit', event => {
  event.preventDefault();
  openAddress(address.value);
});

document.querySelectorAll('[data-url]').forEach(button => {
  button.addEventListener('click', () => {
    address.value = button.dataset.url;
    openAddress(button.dataset.url);
  });
});
</script>
</body>
</html>
